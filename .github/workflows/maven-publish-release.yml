# This workflow publishes release artifacts to Maven Central via the Sonatype Central Portal
# Triggered when a GitHub release is created or a tag starting with 'v' is pushed

name: Maven Publish Release

on:
    release:
        types: [created]
    push:
        tags:
            - "v*"

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Set up JDK 25
              uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
              with:
                  java-version: "25"
                  distribution: "temurin"
                  server-id: central
                  server-username: MAVEN_USERNAME
                  server-password: MAVEN_PASSWORD

            - name: Set release version
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  VERSION="${RELEASE_TAG#v}"
                  if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ || "$VERSION" == *-SNAPSHOT ]]; then
                      printf '%s\n' 'Invalid release tag: expected a non-SNAPSHOT release version' >&2
                      exit 1
                  fi
                  ./mvnw --batch-mode versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

            - name: Import GPG key
              run: |
                  echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

            - name: Publish to Maven Central
              run: ./mvnw --batch-mode -Drelease -Dgpg.passphrase=${{ secrets.GPG_PASSPHRASE }} deploy
              env:
                  MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
                  MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}