# This workflow publishes release artifacts to Maven Central via the Sonatype Central Portal
# Triggered when a GitHub release is created or a tag starting with 'v' is pushed

name: Maven Publish Release

on:
    release:
        types: [created]
    push:
        tags:
            - "v*"

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v7
            - name: Set up JDK 25
              uses: actions/setup-java@v6.1.0
              with:
                  java-version: "25"
                  distribution: "temurin"
                  server-id: central
                  server-username: MAVEN_USERNAME
                  server-password: MAVEN_PASSWORD

            - name: Set release version
              run: |
                  VERSION=${GITHUB_REF_NAME#v}
                  ./mvnw --batch-mode -ntp versions:set "-DnewVersion=$VERSION" -DgenerateBackupPoms=false

            - name: Import GPG key
              run: |
                  printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
              env:
                  GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

            - name: Publish to Maven Central
              run: ./mvnw --batch-mode -ntp -Drelease -Dgpg.bestPractices=true deploy
              env:
                  MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
                  MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
                  MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

            - name: Retain publishing verification reports
              if: always()
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: release-verification
                  path: |
                      **/target/surefire-reports/
                      **/target/site/jacoco/
                  retention-days: 14
